{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — EventHub</title>
    <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
</head>
<body>

    <!-- ÉLÉMENTS FLOTTANTS D'ARRIÈRE-PLAN DE LA PAGE -->
    <div class="floating-bg-container" aria-hidden="true">
        <div class="floating-orb orb-1"></div>
        <div class="floating-orb orb-2"></div>
        <div class="floating-orb orb-3"></div>
        
        <div class="floating-star star-1">✦</div>
        <div class="floating-star star-2">✨</div>
        <div class="floating-star star-3">⭐</div>
        <div class="floating-star star-4">✦</div>
        <div class="floating-star star-5">✨</div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- CROIX X RETOUR A L'ACCUEIL -->
            <a href="{% url 'home' %}" class="close-btn" title="Retour à l'accueil">✕</a>

            <a href="{% url 'home' %}" class="logo">
                <span class="logo-symbol">e</span>
                <span>Event<span class="logo-accent">Hub</span></span>
            </a>

            <h1>Bon retour parmi nous !</h1>
            <p class="login-subtitle">Connectez-vous pour retrouver vos événements et votre communauté.</p>

            <!-- Formulaire de connexion -->
            <form method="post" action="" class="login-form">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Nom d'utilisateur ou Email</label>
                    <input type="text" id="username" name="username" placeholder="Entrez votre identifiant" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Se souvenir de moi
                    </label>
                    <a href="#" class="forgot-password">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="submit-button">Se connecter</button>
            </form>

            <p class="signup-redirect">
                Vous n'avez pas de compte ? <a href="/accounts/signup/">Inscrivez-vous gratuitement</a>
            </p>

        </div>
    </div>

</body>
</html>
